name: Post daily card to X

on:
  push:
    branches: [main]
    paths: ["post/post.txt", "post/card.png"]
  workflow_dispatch:
    inputs:
      force:
        description: "Post again even if today's post already went out"
        type: boolean
        default: false

concurrency:
  group: post-to-x
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests requests-oauthlib
      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_POSTING_PAUSED: ${{ vars.X_POSTING_PAUSED }}
          FORCE_POST: ${{ inputs.force && '1' || '0' }}
        run: python scripts/post_to_x.py
      - name: Record the post
        run: |
          if [ -n "$(git status --porcelain posted)" ]; then
            git config user.name "football-board-bot"
            git config user.email "football-board-bot@users.noreply.github.com"
            git add posted
            git commit -m "Log X post [skip ci]"
            git pull --rebase origin main
            git push
          fi
